    <div class="container">
        <div class="logo">
            <a href="{{ url_for('home') }}" class="brand" aria-label="SyncSpace home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 40 40" fill="none">
                        <path d="M11.5 15.3a9.8 9.8 0 0 1 16.8-3.7" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                        <path d="m27.8 7.2.5 4.5-4.5.5" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M28.5 24.7a9.8 9.8 0 0 1-16.8 3.7" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                        <path d="m12.2 32.8-.5-4.5 4.5-.5" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>

                <span class="brand-name">Sync<span>Space</span></span>
            </a>
        </div>
        <div class="nav-links">

                <a href="{{ url_for('auth.login') }}" class="login-btn">Login</a>
