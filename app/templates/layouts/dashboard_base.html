<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}
        SyncSpace
        {% endblock %}

    </title>

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link
rel="stylesheet"
href="{{ url_for('static', filename='css/variables.css') }}">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/buttons.css') }}">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/cards.css') }}">


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/layout.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/sidebar.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/topbar.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}">

        <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">

        <link rel="stylesheet" href="{{ url_for('static', filename='css/friends.css') }}">
<link
rel="stylesheet"
href="{{ url_for('static', filename='css/chat.css') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">

    </head>

<body data-theme="{{ dashboard.settings.get('theme', 'dark') if dashboard is defined else 'dark' }}" data-compact="{{ 'true' if dashboard is defined and dashboard.settings.get('compact_mode', False) else 'false' }}">

    <div class="dashboard-wrapper">

        {% include "includes/sidebar.html" %}

        <div class="main-content">

            {% include "includes/topbar.html" %}

            <main class="page-content">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-container">
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}
    {% endblock %}

</main>

        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>

<script>
    lucide.createIcons();
</script>
<script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>

<script src="{{ url_for('static', filename='js/chat.js') }}?v=20260808"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}?v=20260808"></script>
<script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>

</body>

</html>
