{% extends "base.html" %}

{% block title %}
Register | SyncSpace
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1>Create Your Account</h1>

        <p>
            Join SyncSpace and start collaborating today.
        </p>

        <form method="POST">

    <div class="form-group">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required>

    </div>

    <div class="form-group">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required>

    </div>

    <div class="form-group">

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required>

    </div>

    <div class="form-group">

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            required>

    </div>

    <button
        type="submit"
        class="auth-btn">

        Create Account

    </button>

</form>

        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">

                Login

            </a>

        </div>

    </div>

</section>

{% endblock %}
