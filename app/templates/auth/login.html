{% extends "base.html" %}

{% block title %}
Login | SyncSpace
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>

            Sign in to continue to SyncSpace.

        </p>

        <form method="POST">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <button
                type="submit"
                class="auth-btn">

                Login

            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">

                Register

            </a>

        </div>

    </div>

</section>

{% endblock %}
